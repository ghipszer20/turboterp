<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TurboTerp logo · centering and size options</title>
<style>
  body { margin: 0; padding: 32px 40px 48px; background: #e7e8ec; font: 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: #1d1d1f; }
  h2 { margin: 0 0 14px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #3f4450; }
  .row { display: flex; gap: 28px; align-items: flex-start; margin-bottom: 34px; }
  .opt { text-align: center; width: 220px; }
  .opt svg.big { width: 200px; height: 200px; display: block; margin: 0 auto 10px; border-radius: 45px; }
  .opt b { display: block; font-size: 15px; }
  .opt small { display: block; color: #6e6e73; margin-top: 2px; }
  .guides line { stroke: rgb(255 255 255 / .55); stroke-width: .6; stroke-dasharray: 2 2; }
  .guides rect { fill: none; stroke: rgb(255 255 255 / .6); stroke-width: .6; }
  .ctx { display: flex; gap: 28px; align-items: center; }
  .ctx .cell { background: #f5f5f7; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; gap: 8px; font: 700 22px/1 ui-rounded, "Segoe UI", sans-serif; letter-spacing: -.02em; width: 220px; box-sizing: border-box; }
  .ctx .cell em { font-style: normal; color: #ba0c2f; }
  .ctx .cell svg { width: 26px; height: 26px; border-radius: 6px; }
  .home { display: flex; gap: 28px; }
  .home .cell { width: 220px; display: flex; justify-content: center; padding: 14px 0; background: #cfd3db; border-radius: 12px; }
  .home svg { width: 60px; height: 60px; border-radius: 13.5px; }
</style>
</head>
<body>
<h2>Red tile at 200px · dashed lines are the tile's center, the thin box is the mark's bounding box</h2>
<div class="row" id="big"></div>
<h2>In the sidebar at 26px</h2>
<div class="row ctx" id="ctx"></div>
<h2>As a home-screen icon at 60px</h2>
<div class="row home" id="home"></div>

<script>
const MARK = `<g transform="translate(27.2 0) skewX(-14) translate(10.2 12.8) scale(.84)" fill="#fff">
    <path d="M25 78a37 33 0 0 1 74 0z"/>
    <rect x="25" y="74" width="74" height="10" rx="5"/>
    <path d="M92 76c2-9 7-15 14-15a9 9 0 0 1 0 18c-3 0-5 2-7 5H92z"/>
    <rect x="36" y="76" width="13" height="19" rx="6.500" transform="rotate(28 42.500 80)"/>
    <rect x="74" y="76" width="13" height="19" rx="6.500" transform="rotate(-28 80.500 80)"/>
  </g>
  <path d="M13 69H31M18 82H31" fill="none" stroke="#fff" stroke-width="6.500" stroke-linecap="round"/>`;

function svg(transform, guides, cls) {
  return `<svg class="${cls}" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D0183C"/><stop offset="1" stop-color="#A80A29"/></linearGradient></defs>
  <rect width="128" height="128" rx="29" fill="url(#g)"/>
  <g class="mark" transform="${transform}">${MARK}</g>${guides}</svg>`;
}

// Measure the mark as drawn today (tile space).
const probe = document.createElementNS("http://www.w3.org/2000/svg", "svg");
probe.setAttribute("viewBox", "0 0 128 128"); probe.style.cssText = "position:absolute;width:128px;height:128px;left:-999px";
probe.innerHTML = `<g class="mark">${MARK}</g>`; document.body.appendChild(probe);
const bb = probe.querySelector(".mark").getBBox(); probe.remove();
const cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
const info = `bbox x ${bb.x.toFixed(1)}–${(bb.x + bb.width).toFixed(1)}, y ${bb.y.toFixed(1)}–${(bb.y + bb.height).toFixed(1)} · center (${cx.toFixed(1)}, ${cy.toFixed(1)}) vs tile (64, 64)`;
console.log(info);

// Options: current, then centered at several sizes (scale about the mark's own center).
const opts = [
  { name: "Current", sub: `as shipped · ${info}`, k: 1, center: false },
  { name: "Centered, same size", sub: "mark moved so its box is centered", k: 1, center: true },
  { name: "Centered, smaller", sub: "85% of today", k: 0.85, center: true },
  { name: "Centered, larger", sub: "115% of today", k: 1.15, center: true },
  { name: "Centered, largest", sub: "130% of today", k: 1.3, center: true },
];
function transformFor(o) {
  const to = o.center ? [64, 64] : [cx, cy];
  return `translate(${to[0]} ${to[1]}) scale(${o.k}) translate(${-cx} ${-cy})`;
}
function guidesFor(o) {
  const w = bb.width * o.k, h = bb.height * o.k;
  const to = o.center ? [64, 64] : [cx, cy];
  return `<g class="guides"><line x1="64" y1="0" x2="64" y2="128"/><line x1="0" y1="64" x2="128" y2="64"/><rect x="${to[0] - w / 2}" y="${to[1] - h / 2}" width="${w}" height="${h}"/></g>`;
}
document.getElementById("big").innerHTML = opts.map((o) => `<div class="opt">${svg(transformFor(o), guidesFor(o), "big")}<b>${o.name}</b><small>${o.sub}</small></div>`).join("");
document.getElementById("ctx").innerHTML = opts.map((o) => `<div class="cell">${svg(transformFor(o), "", "")}<span>Turbo<em>Terp</em></span></div>`).join("");
document.getElementById("home").innerHTML = opts.map((o) => `<div class="cell">${svg(transformFor(o), "", "")}</div>`).join("");
</script>
</body>
</html>
