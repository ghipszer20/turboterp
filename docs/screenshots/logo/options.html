<!doctype html>
<meta charset="utf-8">
<title>TurboTerp logo options, round 2</title>
<style>
  body { font: 15px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; margin: 0; background: #f5f5f7; color: #1d1d1f; }
  h1 { font-size: 22px; margin: 20px 24px 4px; }
  p { margin: 0 24px 14px; color: #6e6e73; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 0 24px 24px; }
  .opt { border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .opt h2 { font-size: 16px; margin: 0; padding: 14px 18px 0; }
  .opt small { display: block; padding: 2px 18px 10px; color: #6e6e73; min-height: 38px; }
  .big { display: flex; justify-content: center; padding: 6px 0 14px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
  .dark { background: #1c1c1e; color: #f5f5f7; }
  .word { font: 700 20px/1 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .word span { color: #BA0C2F; } .dark .word span { color: #ff4d6a; }
</style>
<h1>TurboTerp logo options, round 2</h1>
<p>Drawn from a real diamondback terrapin: oval shell with its scute pattern and keel knobs, speckled skin, blunt head, large webbed hind feet. White on the original red (#BA0C2F).</p>
<div class="grid" id="grid"></div>
<script>
const R = '#BA0C2F';
const box = (inner) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="${R}"/>${inner}</svg>`;
const mirror = (s) => s + `<g transform="translate(128 0) scale(-1 1)">${s}</g>`;

// Top-down body, shared by E and F.
const limbs = mirror(`
  <path d="M45 45c-6-5-12-9-18-12l-6-6 1 7-8-2 4 7-6 3 9 3c6 5 12 9 18 13z"/>
  <path d="M42 86c-7 3-13 7-17 12l-9 2 6 4-7 6 9-1-2 8 8-7c6-4 13-8 19-11z"/>`);
const body = `<g fill="#fff">${limbs}
  <path d="M60 99 64 116 68 99z"/>
  <path d="M56 41c-1-10 0-22 8-22s9 12 8 22z"/>
  <path d="M64 35c16 0 29 14 30 34 1 19-12 33-30 33S33 88 34 69c1-20 14-34 30-34z"/>
</g>`;
const speckles = `<g fill="${R}">${mirror(`
  <circle cx="59.500" cy="25" r="1.500"/><circle cx="61.500" cy="31" r="1"/>
  <circle cx="27" cy="39" r="1.500"/><circle cx="33" cy="44" r="1.400"/><circle cx="38.500" cy="49" r="1.200"/>
  <circle cx="28" cy="103" r="1.600"/><circle cx="34" cy="98.500" r="1.400"/><circle cx="40" cy="94.500" r="1.200"/>`)}</g>`;
const ring = `<path d="M64 41c13 0 23 12 24 28 1 16-9 27-24 27S39 85 40 69c1-16 11-28 24-28z" fill="none" stroke="${R}" stroke-width="1.800"/>`;
const vertebrals = `<g fill="none" stroke="${R}" stroke-width="1.800" stroke-linejoin="round" stroke-linecap="round">
  <path d="M58 41.500 54 47.500 58 53.500 54 59.500 58 65.500 54 71.500 58 77.500 54 83.500 58 89.500 60 96"/>
  <path d="M70 41.500 74 47.500 70 53.500 74 59.500 70 65.500 74 71.500 70 77.500 74 83.500 70 89.500 68 96"/>
  <path d="M58 53.500H70M58 65.500H70M58 77.500H70M58 89.500H70"/>
</g>`;
const costals = `<g fill="none" stroke="${R}" stroke-width="1.800" stroke-linecap="round">${mirror(`
  <path d="M54 47.500 46.500 47M54 59.500 41.500 59M54 71.500 40 73M54 83.500 43.500 87"/>`)}</g>`;
const knobs = `<g fill="${R}"><path d="M64 45 66 47.500 64 50 62 47.500zM64 57 66 59.500 64 62 62 59.500zM64 69 66 71.500 64 74 62 71.500zM64 81 66 83.500 64 86 62 83.500z"/></g>`;

// Side profile.
const side = `<g transform="translate(3 6) scale(.93)">
  <g fill="#fff">
    <path d="M22 80 6 90 23 86z"/>
    <path d="M34 82c-1 8-5 14-12 17-2 1-1 4 1 4h17c5-5 7-12 7-19z"/>
    <path d="M84 83c1 8 5 14 12 17 2 1 1 4-1 4H79c-5-5-7-12-7-19z"/>
    <path d="M98 70c6-8 13-15 21-15 6 0 9 4 9 8 0 5-5 8-11 8-3 4-8 10-12 13z"/>
    <path d="M20 80c1-22 20-37 44-37s41 13 43 33v6c-28 5-60 5-87 2z"/>
  </g>
  <g fill="none" stroke="${R}" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 75c28 4 58 4 85-2"/>
    <path d="M33 59c18-8 44-9 62-1"/>
    <path d="M44 53 40 76M63 50v28M82 52 87 76"/>
    <path d="M30 76v5M49 77.500v5M68 78v5M87 76.500v5M100 74v5"/>
    <path d="M49 63.500 53 66 57 63.500M69 63.500 73 66 77 63.500M29.500 66.500 32 69 34.500 66.500M90 65.500 93 68 96 65.500"/>
  </g>
  <g fill="${R}">
    <circle cx="120" cy="60.500" r="1.900"/><circle cx="111" cy="66" r="1.200"/><circle cx="106.500" cy="71" r="1.200"/><circle cx="113" cy="71.500" r="1"/>
    <circle cx="30" cy="92" r="1.300"/><circle cx="35" cy="97" r="1.200"/><circle cx="88" cy="93" r="1.300"/><circle cx="83" cy="98" r="1.200"/>
  </g>
</g>`;

const options = [
  ["E. From above, full shell", "Every scute: 5 down the spine with keel knobs, 4 on each side, and the rim.", body + ring + vertebrals + costals + knobs + speckles],
  ["F. From above, simplified", "Same terrapin with only the spine scutes, so it stays crisp when tiny.", body + vertebrals + knobs + speckles],
  ["G. Side profile", "Walking terrapin: low domed shell with scute seams, speckled neck and legs.", side],
];
const img = (svg, px) => `<img width="${px}" height="${px}" alt="" src="data:image/svg+xml;utf8,${encodeURIComponent(svg)}">`;
document.getElementById('grid').innerHTML = options.map(([name, note, inner]) => {
  const svg = box(inner);
  const sizes = [64, 32, 16].map((s) => img(svg, s)).join('');
  const word = `<div class="word">${img(svg, 28)}<div>Turbo<span>Terp</span></div></div>`;
  return `<div class="opt"><h2>${name}</h2><small>${note}</small><div class="big">${img(svg, 260)}</div><div class="row">${sizes}${word}</div><div class="row dark">${sizes}${word}</div></div>`;
}).join('');
</script>
