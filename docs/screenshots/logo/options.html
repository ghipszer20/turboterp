<!doctype html>
<meta charset="utf-8">
<title>TurboTerp logo concepts</title>
<style>
  body { font: 14px/1.35 -apple-system, system-ui, "Segoe UI", sans-serif; margin: 0; background: #f5f5f7; color: #1d1d1f; }
  h1 { font-size: 21px; margin: 16px 20px 2px; }
  p { margin: 0 20px 12px; color: #6e6e73; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 0 20px 20px; }
  .opt { border-radius: 16px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 12px 14px 12px; }
  .opt h2 { font-size: 15px; margin: 0; }
  .opt small { display: block; color: #6e6e73; min-height: 36px; margin-bottom: 8px; }
  .big { display: flex; justify-content: center; }
  .big img { filter: drop-shadow(0 6px 14px rgba(120, 8, 30, .28)); }
  .row { display: flex; align-items: center; justify-content: center; gap: 12px; padding-top: 12px; }
</style>
<h1>TurboTerp logo concepts (fresh start)</h1>
<p>Eight ideas, each built from a few simple shapes on the original red. Shown large, then at 48, 32 and 16 px.</p>
<div class="grid" id="grid"></div>
<script>
let n = 0;
const box = (inner) => { const g = `g${n++}`; return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D0183C"/><stop offset="1" stop-color="#A80A29"/></linearGradient></defs><rect width="128" height="128" rx="29" fill="url(#${g})"/>${inner}</svg>`; };
const W = '#fff', R = '#BA0C2F';
const line = (d, w = 7) => `<path d="${d}" fill="none" stroke="${W}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const cut = (d, w = 5) => `<path d="${d}" fill="none" stroke="${R}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

// A solid side-view terrapin made of a dome, a head and two feet.
const solid = (fill) => `<g fill="${fill}">
  <path d="M25 78a37 33 0 0 1 74 0z"/>
  <rect x="25" y="74" width="74" height="10" rx="5"/>
  <path d="M92 76c2-9 7-15 14-15a9 9 0 0 1 0 18c-3 0-5 2-7 5H92z"/>
  <rect x="37" y="80" width="13" height="15" rx="6.500"/>
  <rect x="74" y="80" width="13" height="15" rx="6.500"/>
</g>`;

const hex = (cx, cy, r) => "M" + [0, 1, 2, 3, 4, 5].map((i) => { const a = (Math.PI / 3) * i - Math.PI / 2; return `${(cx + r * Math.cos(a)).toFixed(2)} ${(cy + r * Math.sin(a)).toFixed(2)}`; }).join("L") + "z";

const options = [
  ["Silhouette", "A solid terrapin in profile. Nothing else.", solid(W)],
  ["Silhouette with shell seams", "The same profile with three plate lines cut into the shell.", solid(W) + cut("M44 78 50 60H74L80 78M50 60 45 50M74 60 79 50", 4)],
  ["Single line", "One even line: shell, head and two steps.", line("M18 82H98M24 82a35 31 0 0 1 70 0M42 82v11M76 82v11", 6.500) + `<circle cx="106.500" cy="73" r="8.500" fill="none" stroke="${W}" stroke-width="6.500"/>`],
  ["Shell only", "Just the domed shell with its plates, sitting on a line.", `<path d="M24 82a40 38 0 0 1 80 0z" fill="${W}"/><rect x="18" y="88" width="92" height="7" rx="3.500" fill="${W}"/>` + cut("M45 82 52 62H76L83 82M52 62 46 49M76 62 82 49", 4.500)],
  ["Turbo", "The profile leaning forward with speed lines: the 'Turbo' in the name.", `<g transform="translate(22 0) skewX(-12)">${solid(W)}</g>` + line("M10 62H26M6 74H22M12 86H24", 5)],
  ["Cut-out", "A white disc with the terrapin cut out of it.", `<circle cx="64" cy="64" r="43" fill="${W}"/><g transform="translate(13.500 14) scale(.78)">${solid(R)}</g>`],
  ["M in the shell", "A domed shell whose seams are an M.", `<path d="M22 88a42 42 0 0 1 84 0z" fill="${W}"/><rect x="16" y="93" width="96" height="7" rx="3.500" fill="${W}"/>` + cut("M42 88V62L64 80 86 62V88", 6)],
  ["Inverted", "The plain silhouette in red on a white tile, for places where a white icon suits better.", "__INV__"],
];
const img = (svg, px) => `<img width="${px}" height="${px}" alt="" src="data:image/svg+xml;utf8,${encodeURIComponent(svg)}">`;
document.getElementById('grid').innerHTML = options.map(([name, note, inner], i) => {
  const svg = inner === "__INV__" ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect x=".5" y=".5" width="127" height="127" rx="29" fill="#fff" stroke="#e5e5ea"/>${solid(R)}</svg>` : box(inner);
  return `<div class="opt"><h2>${i + 1}. ${name}</h2><small>${note}</small><div class="big">${img(svg, 190)}</div><div class="row">${[48, 32, 16].map((s) => img(svg, s)).join('')}</div></div>`;
}).join('');
</script>
