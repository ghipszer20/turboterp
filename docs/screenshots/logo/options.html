<!doctype html>
<meta charset="utf-8">
<title>TurboTerp logo options, round 4</title>
<style>
  body { font: 15px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; margin: 0; background: #f5f5f7; color: #1d1d1f; }
  h1 { font-size: 22px; margin: 20px 24px 4px; }
  p { margin: 0 24px 14px; color: #6e6e73; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 0 24px 24px; }
  .opt { border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .opt h2 { font-size: 16px; margin: 0; padding: 14px 18px 0; }
  .opt small { display: block; padding: 2px 18px 10px; color: #6e6e73; min-height: 38px; }
  .big { display: flex; justify-content: center; padding: 6px 0 14px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
  .dark { background: #1c1c1e; color: #f5f5f7; }
  .word { font: 700 20px/1 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .word span { color: #BA0C2F; } .dark .word span { color: #ff4d6a; }
</style>
<h1>TurboTerp logo options, round 4</h1>
<p>K is a striding side view in the spirit of a sports-team terrapin (but its own drawing); I and J are the view from above. Every shell is covered in the diamond pattern; legs are plain shapes. White on the original red (#BA0C2F).</p>
<div class="grid" id="grid"></div>
<script>
const R = '#BA0C2F';
let uid = 0;
const SHELL = "M64 34c17 0 31 15 32 35 1 20-13 35-32 35S31 89 32 69c1-20 15-35 32-35z";
const INNER = "M64 39.500c14 0 25.500 12.500 26.500 29.500 1 17-10.500 29.500-26.500 29.500S36.500 86 37.500 69c1-17 12.500-29.500 26.500-29.500z";
const body = `<g fill="#fff">
  <ellipse cx="33" cy="43" rx="11.500" ry="6.800" transform="rotate(40 33 43)"/>
  <ellipse cx="95" cy="43" rx="11.500" ry="6.800" transform="rotate(-40 95 43)"/>
  <ellipse cx="34" cy="96" rx="10.500" ry="6.400" transform="rotate(-40 34 96)"/>
  <ellipse cx="94" cy="96" rx="10.500" ry="6.400" transform="rotate(40 94 96)"/>
  <path d="M60.500 101 64 115 67.500 101z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="64" cy="25.500" rx="8.500" ry="11"/>
  <path d="${SHELL}"/>
</g>`;
// Diamond lattice: cells w wide and h tall, with a vertex column on the shell's centre line.
function lattice(w, h, stroke) {
  const k = w / h, lines = [];
  for (let c = 64 - 20 * w; c <= 64 + 20 * w; c += w) {
    lines.push(`M${c} 22l${k * 96} 96`, `M${c} 22l${-k * 96} 96`);
  }
  return `<path d="${lines.join("")}" fill="none" stroke="${R}" stroke-width="${stroke}"/>`;
}
function diamonds(w, h, scale) {
  const out = [];
  for (let row = -1; row < 14; row++) {
    const y = 22 + h / 2 + (row * h) / 2 + 8, off = row % 2 ? w / 2 : 0;
    for (let x = 64 - 5 * w + off; x <= 64 + 5 * w; x += w) {
      const a = (w / 2) * scale, b = (h / 2) * scale;
      out.push(`M${x} ${y - b}l${a} ${b}-${a} ${b}-${a}-${b}z`);
    }
  }
  return `<path d="${out.join("")}" fill="${R}"/>`;
}
const __c = 0;
const clipped = (pattern, shape) => { const id = `c${uid++}`; return `<clipPath id="${id}"><path d="${shape}"/></clipPath><g clip-path="url(#${id})">${pattern}</g>`; };
const box = (inner) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="${R}"/>${inner}</svg>`;

const S_SHELL = "M18 76C22 58 44 46 68 47c22 1 38 13 38 27-26 9-62 10-88 2z";
const S_INNER = "M25 73.500C29 61 47 51.500 68 52.500c18 1 31 9 33 19-23 7-53 8-76 2z";
function sideView() {
  return `<g transform="translate(1 4) scale(.94)">
    <g fill="#fff">
      <path d="M22 72 5 77 22 80z"/>
      <path d="M52 80 60 100H48L42 82z"/>
      <path d="M80 80 74 100H86L92 82z"/>
      <path d="M40 78c-3 7-9 13-18 16-3 1-2 6 1 6h13c7-5 12-12 15-20z"/>
      <path d="M88 76c5 8 11 14 20 17 3 1 2 6-1 6H94c-7-5-12-12-15-20z"/>
      <path d="M96 68c7-8 14-17 22-19 6-1 10 3 10 8 0 5-5 8-12 9-3 5-7 11-13 15z"/>
      <path d="M22 76c26 9 60 8 84-2v5c-24 10-58 11-82 3z"/>
      <path d="${S_SHELL}"/>
    </g>
    ${clipped(`<g transform="translate(0 2)">${lattice(16, 15, 2.400)}</g>`, S_INNER)}
    <path d="${S_INNER}" fill="none" stroke="${R}" stroke-width="2.400" stroke-linejoin="round"/>
    <circle cx="120.500" cy="55" r="2" fill="${R}"/>
    <path d="M119.500 61.500 127 59.500" fill="none" stroke="${R}" stroke-width="1.600" stroke-linecap="round"/>
  </g>`;
}
const options = [
  ["K. Striding, side view", "Low shell covered in diamonds, head up and stepping forward. No M, flag pattern or mascot face.", () => sideView()],
  ["I. Bold diamonds", "Fewer, larger diamonds so the pattern still shows at small sizes.", () => body + clipped(lattice(18, 23, 2.600), INNER) + `<path d="${INNER}" fill="none" stroke="${R}" stroke-width="2.600"/>`],
  ["J. Solid diamonds", "Filled red diamonds in a harlequin pattern, edge to edge.", () => body + clipped(diamonds(15, 20, 0.780), SHELL)],
];
const img = (svg, px) => `<img width="${px}" height="${px}" alt="" src="data:image/svg+xml;utf8,${encodeURIComponent(svg)}">`;
document.getElementById('grid').innerHTML = options.map(([name, note, make]) => {
  const svg = box(make());
  const sizes = [64, 32, 16].map((s) => img(svg, s)).join('');
  const word = `<div class="word">${img(svg, 28)}<div>Turbo<span>Terp</span></div></div>`;
  return `<div class="opt"><h2>${name}</h2><small>${note}</small><div class="big">${img(svg, 260)}</div><div class="row">${sizes}${word}</div><div class="row dark">${sizes}${word}</div></div>`;
}).join('');
</script>
