<!doctype html>
<meta charset="utf-8">
<title>TurboTerp logo options, round 7</title>
<style>
  body { font: 15px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; margin: 0; background: #f5f5f7; color: #1d1d1f; }
  h1 { font-size: 22px; margin: 20px 24px 4px; }
  p { margin: 0 24px 14px; color: #6e6e73; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 0 24px 24px; }
  .opt { border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .opt h2 { font-size: 16px; margin: 0; padding: 14px 18px 0; }
  .opt small { display: block; padding: 2px 18px 10px; color: #6e6e73; min-height: 38px; }
  .big { display: flex; justify-content: center; padding: 6px 0 14px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
  .dark { background: #1c1c1e; color: #f5f5f7; }
  .word { font: 700 20px/1 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .word span { color: #BA0C2F; } .dark .word span { color: #ff4d6a; }
</style>
<h1>TurboTerp logo options, round 7</h1>
<p>Option L, both sizes: no white border, so the legs, head and tail join the plated shell directly. The head has a neck and eyes; the legs are tapered with a broad foot.</p>
<div class="grid" id="grid"></div>
<script>
const R = '#BA0C2F';
let uid = 0;
const clipped = (pattern, shape) => { const id = `c${uid++}`; return `<clipPath id="${id}"><path d="${shape}"/></clipPath><g clip-path="url(#${id})">${pattern}</g>`; };
const box = (inner) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="${R}"/>${inner}</svg>`;
const mirror = (s) => s + `<g transform="translate(128 0) scale(-1 1)">${s}</g>`;
// A plate drawn at `scale` about its own centre: 1 is the seam, smaller values are growth rings.
function plate(pts, scale) {
  const cx = pts.reduce((n, p) => n + p[0], 0) / pts.length, cy = pts.reduce((n, p) => n + p[1], 0) / pts.length;
  return "M" + pts.map(([x, y]) => `${(cx + (x - cx) * scale).toFixed(2)} ${(cy + (y - cy) * scale).toFixed(2)}`).join("L") + "z";
}
function plates(list, rings, seam, ringW, dot) {
  const seams = list.map((p) => plate(p, 1)).join("");
  const inner = rings.map((r) => list.map((p) => plate(p, r)).join("")).join("");
  const dots = dot ? list.map((p) => plate(p, dot)).join("") : "";
  return `<path d="${seams}" fill="#fff" stroke="${R}" stroke-width="${seam}" stroke-linejoin="round"/>` +
    (inner ? `<path d="${inner}" fill="none" stroke="${R}" stroke-width="${ringW}" stroke-linejoin="round"/>` : "") +
    (dots ? `<path d="${dots}" fill="${R}"/>` : "");
}

// ---- From above ----
const SHELL = "M64 34c17 0 31 15 32 35 1 20-13 35-32 35S31 89 32 69c1-20 15-35 32-35z";
const LEG = "M-3-4.800 15-6.800c6-1 10.500 2.500 10.500 6.800s-4.500 7.800-10.500 6.800L-3 4.800z";
const body = `<g fill="#fff">
  <path d="${LEG}" transform="translate(45 50) rotate(222)"/>
  <path d="${LEG}" transform="translate(83 50) rotate(-42)"/>
  <path d="${LEG}" transform="translate(44 90) rotate(140) scale(1.050)"/>
  <path d="${LEG}" transform="translate(84 90) rotate(40) scale(1.050)"/>
  <path d="M61 101 64 116 67 101z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  <path d="M58.500 38c0-6-3-10-3-15.500C55.500 16.500 59.200 13 64 13s8.500 3.500 8.500 9.500c0 5.500-3 9.500-3 15.500z"/>
</g>
<g fill="${R}"><circle cx="59.300" cy="21.500" r="1.500"/><circle cx="68.700" cy="21.500" r="1.500"/></g>`;
const V = [
  [[59,34.3],[69,34.3],[75,46],[70.5,52],[57.5,52],[53,46]],
  [[57.5,52],[70.5,52],[75.5,58],[70.5,64],[57.5,64],[52.5,58]],
  [[57.5,64],[70.5,64],[75.5,70],[70.5,76],[57.5,76],[52.5,70]],
  [[57.5,76],[70.5,76],[75.5,82],[70.5,88],[57.5,88],[52.5,82]],
  [[57.5,88],[70.5,88],[74,93],[67,103.8],[61,103.8],[54,93]],
];
const CL = [
  [[59,34.3],[53,46],[57.5,52],[52.5,58],[35,55.1],[42,44],[52,36.7]],
  [[52.5,58],[57.5,64],[52.5,70],[32,69],[33,62],[35,55.1]],
  [[52.5,70],[57.5,76],[52.5,82],[33.9,82.9],[32.3,76],[32,69]],
  [[52.5,82],[57.5,88],[54,93],[61,103.8],[50.8,101.4],[40.5,94],[33.9,82.9]],
];
const flip = (p) => p.map(([x, y]) => [128 - x, y]);
const C = [...CL, ...CL.map(flip)];
const rimTicks = `<path d="${mirror('').length ? '' : ''}M64 40V33M64 98.500V105" fill="none" stroke="${R}" stroke-width="1.500"/>` +
  `<g fill="none" stroke="${R}" stroke-width="1.500">${mirror(`<path d="M46 45.500 41 40M39.500 57 33 55M37.500 70 31 70.500M40 83 34 86.500M47.500 93.500 43.500 99M52 42.300 49.500 36.500M42.300 51 36.500 47.500M38.200 63.500 31.500 62.500M38.300 76.500 32 78.500M43.300 88.500 38.500 93M54 96.300 52 102.500"/>`)}</g>`;
const above = (rings, dot) => body + plates([...V, ...C], rings, 1.700, 1.100, dot);

// ---- Side view, striding ----
const S_SHELL = "M18 76C22 58 44 46 68 47c22 1 38 13 38 27-26 9-62 10-88 2z";
const SC = [
  [[26,71.5],[33,61],[47,54],[51,75.2],[39,74.3]],
  [[47,54],[66,51.5],[70,75.7],[60,76],[51,75.2]],
  [[66,51.5],[84,53.5],[88,73.2],[79,75],[70,75.7]],
  [[84,53.5],[98,60],[102,69.3],[88,73.2]],
];
function sideView(rings, dot) {
  const ticks = `<path d="M40 57.500 37.500 49M56.500 52.700 55.500 44M75 52.400 76.500 44M91 56.700 95 49M26 71.500 17 72M102 69.300 110 67M33 73 32 84M45 74.800 44.500 86M57 75.800 57 87M68 75.800 68.500 87M79 75 80 86M90 72.600 92 83M97 70.700 100 80" fill="none" stroke="${R}" stroke-width="1.700"/>`;
  return `<g transform="translate(1 4) scale(.94)">
    <g fill="#fff">
      <path d="M22 72 5 77 22 80z"/>
      <path d="M52 80 60 100H48L42 82z"/>
      <path d="M80 80 74 100H86L92 82z"/>
      <path d="M40 78c-3 7-9 13-18 16-3 1-2 6 1 6h13c7-5 12-12 15-20z"/>
      <path d="M88 76c5 8 11 14 20 17 3 1 2 6-1 6H94c-7-5-12-12-15-20z"/>
      <path d="M96 68c7-8 14-17 22-19 6-1 10 3 10 8 0 5-5 8-12 9-3 5-7 11-13 15z"/>
      <path d="M22 76c26 9 60 8 84-2v5c-24 10-58 11-82 3z"/>
      <path d="${S_SHELL}"/>
    </g>
    ${clipped(plates(SC, rings, 1.900, 1.200, dot) + ticks, S_SHELL)}
    <circle cx="120.500" cy="55" r="2" fill="${R}"/>
    <path d="M119.500 61.500 127 59.500" fill="none" stroke="${R}" stroke-width="1.600" stroke-linecap="round"/>
  </g>`;
}

const options = [
  ["L. Ringed plates, no rim", "For the app icon and anywhere the logo is shown large.", () => above([0.62], 0.26)],
  ["L (small). Plates only", "Same shell without rings, for the browser tab and other tiny sizes.", () => above([], 0)],
];
const img = (svg, px) => `<img width="${px}" height="${px}" alt="" src="data:image/svg+xml;utf8,${encodeURIComponent(svg)}">`;
document.getElementById('grid').innerHTML = options.map(([name, note, make]) => {
  const svg = box(make());
  const sizes = [64, 32, 16].map((s) => img(svg, s)).join('');
  const word = `<div class="word">${img(svg, 28)}<div>Turbo<span>Terp</span></div></div>`;
  return `<div class="opt"><h2>${name}</h2><small>${note}</small><div class="big">${img(svg, 260)}</div><div class="row">${sizes}${word}</div><div class="row dark">${sizes}${word}</div></div>`;
}).join('');
</script>
